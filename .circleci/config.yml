version: 2.1

parameters:
  build_requested:
    type: boolean
    default: true
  expected_commit:
    type: string
    default: ""

jobs:
  test-and-build:
    machine:
      image: ubuntu-2404:current
    resource_class: large.gen2
    environment:
      EXPECTED_COMMIT: << pipeline.parameters.expected_commit >>
      GO_VERSION: "1.24.4"
    steps:
      - checkout
      - run:
          name: Verify source revision
          command: |
            test -z "$EXPECTED_COMMIT" || test "$CIRCLE_SHA1" = "$EXPECTED_COMMIT"
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
      - run:
          name: Set up Go
          command: |
            sudo rm -rf /usr/local/go
            curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
            sudo tar -C /usr/local -xzf /tmp/go.tar.gz
            /usr/local/go/bin/go version
      - run:
          name: Test
          command: /usr/local/go/bin/go test ./...
      - run:
          name: Race test
          command: /usr/local/go/bin/go test -race ./...
      - run:
          name: Vet
          command: /usr/local/go/bin/go vet ./...
      - run:
          name: Bounded context recall integration
          command: |
            /usr/local/go/bin/go test -tags recall_offline ./internal/adapter -run '^TestContextRecall' -count=1 -timeout=120s
            /usr/local/go/bin/go test -race -tags recall_offline ./internal/adapter -run '^TestContextRecallHTTPIntegration$' -count=1 -timeout=90s
      - run:
          name: Telemetry report tests
          command: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run:
          name: Build Linux amd64
          environment:
            CGO_ENABLED: "0"
            GOOS: linux
            GOARCH: amd64
          command: |
            mkdir -p /tmp/adapter-artifacts
            /usr/local/go/bin/go build -trimpath -ldflags="-s -w" -o /tmp/adapter-artifacts/kilo-newapi-adapter ./cmd/kilo-newapi-adapter
            git rev-parse HEAD > /tmp/adapter-artifacts/source-commit.txt
            cd /tmp/adapter-artifacts
            sha256sum kilo-newapi-adapter source-commit.txt > SHA256SUMS
      - run:
          name: Package and verify isolated Python 3.13 tool counter
          command: |
            runtime_image="python:3.13.5-slim-bookworm@sha256:a7cb177dc60dfa77b223192cd0d9e6ce1aac7cf9a569023d68e7c91b6371a718"
            docker run --rm -v "$PWD:/source:ro" -v /tmp/adapter-artifacts:/artifacts "$runtime_image" python3 /source/ops/step-tools/package.py --output /artifacts/step-tools-runtime
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 /usr/local/go/bin/go test -c -o /tmp/adapter-artifacts/step-tools-test ./internal/adapter
            docker run --rm --network none --memory=1g --cpus=2 -v /tmp/adapter-artifacts:/artifacts:ro -e STEP_TOOLS_TEST_BUNDLE=/artifacts/step-tools-runtime "$runtime_image" sh -c 'ln -s /usr/local/bin/python3 /usr/bin/python3; /artifacts/step-tools-test -test.run "^TestStepToolsRealBundle$" -test.v -test.timeout 45s'
            tar --exclude=__pycache__ -czf /tmp/adapter-artifacts/step-tools-runtime.tar.gz -C /tmp/adapter-artifacts step-tools-runtime
            cd /tmp/adapter-artifacts
            sha256sum kilo-newapi-adapter source-commit.txt step-tools-runtime.tar.gz step-tools-test > SHA256SUMS
      - store_artifacts:
          path: /tmp/adapter-artifacts
          destination: kilo-newapi-adapter

workflows:
  test-and-build:
    when:
      << pipeline.parameters.build_requested >>
    jobs:
      - test-and-build
