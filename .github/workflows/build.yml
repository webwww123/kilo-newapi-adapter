name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
          cache: true

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Bounded context recall integration
        run: |
          go test -tags recall_offline ./internal/adapter -run '^TestContextRecall' -count=1 -timeout=120s
          go test -race -tags recall_offline ./internal/adapter -run '^TestContextRecallHTTPIntegration$' -count=1 -timeout=90s

      - name: Telemetry report tests
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'

      - name: Build Linux amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/kilo-newapi-adapter ./cmd/kilo-newapi-adapter

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kilo-newapi-adapter-linux-amd64
          path: dist/kilo-newapi-adapter
          if-no-files-found: error
          retention-days: 14
