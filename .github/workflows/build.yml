name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional commit-specific prerelease tag
        required: false
        type: string

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.4"
          cache: true

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build Linux amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/kilo-newapi-adapter ./cmd/kilo-newapi-adapter

      - name: Upload binary
        if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: kilo-newapi-adapter-linux-amd64
          path: dist/kilo-newapi-adapter
          if-no-files-found: error
          retention-days: 14

      - name: Generate checksum
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        run: sha256sum dist/kilo-newapi-adapter > dist/SHA256SUMS

      - name: Create commit-specific prerelease
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            dist/kilo-newapi-adapter \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Kilo NewAPI adapter $GITHUB_SHA" \
            --notes "Commit-specific CI prerelease for production verification." \
            --prerelease
